    class SoundController {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }
      getAudioContext() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
        return this.ctx;
      }
      playKeyClick() {
        if (!this.enabled) return;
        try {
          const ctx = this.getAudioContext();
          if (!ctx) return;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(320 + Math.random() * 40, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(80, ctx.currentTime + 0.04);
          gain.gain.setValueAtTime(0.08, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.04);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.04);
        } catch(e) {}
      }
      playWordSuccess() {
        if (!this.enabled) return;
        try {
          const ctx = this.getAudioContext();
          if (!ctx) return;
          const notes = [523.25, 659.25, 783.99, 1046.50];
          notes.forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            const startTime = ctx.currentTime + idx * 0.04;
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, startTime);
            gain.gain.setValueAtTime(0, startTime);
            gain.gain.linearRampToValueAtTime(0.12, startTime + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.25);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(startTime);
            osc.stop(startTime + 0.25);
          });
        } catch(e) {}
      }
      playTypo() {
        if (!this.enabled) return;
        try {
          const ctx = this.getAudioContext();
          if (!ctx) return;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(140, ctx.currentTime);
          osc.frequency.linearRampToValueAtTime(90, ctx.currentTime + 0.1);
          gain.gain.setValueAtTime(0.07, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.1);
        } catch(e) {}
      }
      playPromotion() {
        if (!this.enabled) return;
        try {
          const ctx = this.getAudioContext();
          if (!ctx) return;
          const melody = [
            { f: 440.00, t: 0, d: 0.1 },
            { f: 554.37, t: 0.1, d: 0.1 },
            { f: 659.25, t: 0.2, d: 0.12 },
            { f: 880.00, t: 0.32, d: 0.35 },
            { f: 1108.73, t: 0.5, d: 0.5 }
          ];
          melody.forEach(note => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            const startTime = ctx.currentTime + note.t;
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(note.f, startTime);
            gain.gain.setValueAtTime(0, startTime);
            gain.gain.linearRampToValueAtTime(0.14, startTime + 0.03);
            gain.gain.exponentialRampToValueAtTime(0.001, startTime + note.d);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(startTime);
            osc.stop(startTime + note.d);
          });
        } catch(e) {}
      }
      playVictory() {
        if (!this.enabled) return;
        try {
          const ctx = this.getAudioContext();
          if (!ctx) return;
          const chords = [
            { freqs: [523.25, 659.25, 783.99], delay: 0, dur: 0.2 },
            { freqs: [587.33, 739.99, 880.00], delay: 0.18, dur: 0.2 },
            { freqs: [659.25, 830.61, 987.77], delay: 0.36, dur: 0.25 },
            { freqs: [1046.50, 1318.51, 1567.98], delay: 0.58, dur: 0.7 }
          ];
          chords.forEach(chord => {
            chord.freqs.forEach(freq => {
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              const startTime = ctx.currentTime + chord.delay;
              osc.type = 'triangle';
              osc.frequency.setValueAtTime(freq, startTime);
              gain.gain.setValueAtTime(0, startTime);
              gain.gain.linearRampToValueAtTime(0.12, startTime + 0.03);
              gain.gain.exponentialRampToValueAtTime(0.001, startTime + chord.dur);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(startTime);
              osc.stop(startTime + chord.dur);
            });
          });
        } catch(e) {}
      }
      speakEnglish(text) {
        if (typeof window === 'undefined' || !('speechSynthesis' in window)) return;
        try {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'en-US';
          utterance.rate = 0.88;
          utterance.pitch = 1.0;
          window.speechSynthesis.speak(utterance);
        } catch(e) {}
      }

    // Background Music Controller: prioritize same-directory bgm.mp3 (publish/bgm.mp3)
    // with smooth Web Audio API ambient travel chime progression as fallback
    class BgmController {
      constructor() {
        this.audio = null;
        this.enabled = false;
        this.isSynth = false;
        this.synthCtx = null;
        this.synthTimer = null;
        // Priority: 1. same folder as index.html (publish/bgm.mp3)
        //           2. public folder or parent directory
        this.candidateUrls = [
          './bgm.mp3',
          'bgm.mp3',
          '../publish/bgm.mp3',
          '../public/bgm.mp3',
          'public/bgm.mp3'
        ];
        this.currentIdx = 0;
      }

      getAudioElement() {
        if (!this.audio) {
          this.audio = document.getElementById('bgm-player') || new Audio('./bgm.mp3');
          this.audio.loop = true;
          this.audio.volume = 0.35;
        }
        return this.audio;
      }

      startSynthBgm() {
        try {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextClass) return;
          if (!this.synthCtx) {
            this.synthCtx = new AudioContextClass();
          }
          if (this.synthCtx.state === 'suspended') {
            this.synthCtx.resume();
          }
          this.isSynth = true;

          // Gentle ambient travel chime chords (C - Am - F - G)
          const notes = [
            [261.63, 329.63, 392.00, 523.25],
            [220.00, 261.63, 329.63, 440.00],
            [174.61, 220.00, 261.63, 349.23],
            [196.00, 246.94, 293.66, 392.00]
          ];
          let chordIndex = 0;

          const playChord = () => {
            if (!this.enabled || !this.isSynth) return;
            const ctx = this.synthCtx;
            if (!ctx) return;
            const chord = notes[chordIndex % notes.length];
            chordIndex++;

            chord.forEach((freq, i) => {
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              const now = ctx.currentTime + i * 0.16;
              osc.type = 'sine';
              osc.frequency.setValueAtTime(freq, now);
              gain.gain.setValueAtTime(0, now);
              gain.gain.linearRampToValueAtTime(0.024, now + 0.3);
              gain.gain.exponentialRampToValueAtTime(0.0001, now + 2.4);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(now);
              osc.stop(now + 2.4);
            });

            this.synthTimer = setTimeout(playChord, 2400);
          };

          playChord();
        } catch(e) {}
      }

      stopSynthBgm() {
        this.isSynth = false;
        if (this.synthTimer) {
          clearTimeout(this.synthTimer);
          this.synthTimer = null;
        }
      }

      tryPlayMp3(idx = 0) {
        if (!this.enabled) return;
        if (idx >= this.candidateUrls.length) {
          // If all mp3 paths fail, fallback cleanly to ambient synth
          this.startSynthBgm();
          return;
        }

        const audio = this.getAudioElement();
        const targetUrl = this.candidateUrls[idx];
        
        // Only reassign src if different
        if (!audio.src.endsWith(targetUrl.replace(/^\.\//, ''))) {
          audio.src = targetUrl;
        }

        const playPromise = audio.play();
        if (playPromise !== undefined) {
          playPromise.then(() => {
            // Successfully started playing the MP3 file!
            this.stopSynthBgm();
          }).catch(() => {
            // If this candidate path failed, try next candidate or synth
            this.tryPlayMp3(idx + 1);
          });
        }
      }

      toggle() {
        this.enabled = !this.enabled;
        if (this.enabled) {
          this.tryPlayMp3(0);
        } else {
          if (this.audio) {
            this.audio.pause();
          }
          this.stopSynthBgm();
        }
        return this.enabled;
      }
    }

    const STORAGE_KEY = 'typingRanking';

    function formatRankingDate(date = new Date()) {
      const yyyy = date.getFullYear();
      const mm = String(date.getMonth() + 1).padStart(2, '0');
      const dd = String(date.getDate()).padStart(2, '0');
      const hh = String(date.getHours()).padStart(2, '0');
      const min = String(date.getMinutes()).padStart(2, '0');
      return `${yyyy}.${mm}.${dd} ${hh}:${min}`;
    }

    function loadTypingRankings() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {

          if (Array.isArray(parsed)) return parsed;
        }
      } catch(e) {}
      return [];
    }

    function saveTypingRanking(이름, 점수) {
      const current = loadTypingRankings();
      const now = new Date();
      const newRecord = {
        날짜: formatRankingDate(now),
        이름: 이름.trim(),
        점수: 점수,
        timestamp: now.getTime(),
        id: `rank-${now.getTime()}-${Math.random().toString(36).substring(2, 6)}`
      };
      const updated = [newRecord, ...current];
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(updated));
      } catch(e) {}
      return newRecord;

            if (typeof val === 'number') return val;
            const match = String(val).match(/\d+/);
            return match ? parseInt(match[0], 10) : 0;
          };

          // 1. 점수 높은 순서
          // 2. 같은 점수는 먼저 기록한 사람이 위에
          const sorted = [...rawRecords].sort((a, b) => {
            const scoreA = parseScore(a.점수);
            const scoreB = parseScore(b.점수);
            if (scoreB !== scoreA) return scoreB - scoreA;
            const timeA = a.timestamp || (a.날짜 ? new Date(a.날짜.replace(/\./g, '/')).getTime() : 0);
            const timeB = b.timestamp || (b.날짜 ? new Date(b.날짜.replace(/\./g, '/')).getTime() : 0);
            return timeA - timeB;
          });

          // 순위 계산: 점수 같으면 같은 순위 (예: 90, 80, 80, 70 -> 1, 2, 2, 4위)
          let currentRank = 1;
          const ranked = sorted.map((item, idx) => {
            const itemScore = parseScore(item.점수);
            if (idx > 0) {
              const prevScore = parseScore(sorted[idx - 1].점수);
              if (itemScore !== prevScore) {
                currentRank = idx + 1;

                  type="button"
                  onClick={() => setShowLeaderboard(true)}
                  className="px-4 py-2 text-sm sm:text-base font-black text-amber-950 bg-amber-300 hover:bg-amber-400 rounded-xl transition-transform active:scale-95 shadow-xs flex items-center gap-1.5 cursor-pointer"
                >
                  <span>🏆 순위표에서 내 기록 확인</span>
                </button>
              </div>
            )}

            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
              <button
                type="submit"
                disabled={isSaved}
                className={`w-full py-3.5 sm:py-4 px-6 text-lg sm:text-xl font-black rounded-2xl shadow-md transition-all flex items-center justify-center gap-2 ${
                  isSaved
                    ? 'bg-stone-200 text-stone-400 border border-stone-300 cursor-not-allowed shadow-none'
                    : 'text-white bg-amber-600 hover:bg-amber-700 active:scale-98 cursor-pointer'
                }`}
              >
                {isSaved ? (
                  <>
                    <IconCheck className="w-5 h-5 text-emerald-600 stroke-[3]" />
                    <span>기록 완료</span>
                  </>
                ) : (
                  <>
                    <IconBookmarkPlus className="w-5 h-5" />
                    <span>기록 남기기</span>
                  </>
                )}
              </button>

              <button
                type="button"
                onClick={onRestartWithoutSaving}
                className="w-full py-3.5 sm:py-4 px-6 text-base sm:text-lg font-bold text-stone-700 bg-white hover:bg-stone-100 active:scale-98 border-2 border-stone-300 hover:border-stone-400 rounded-2xl transition-all flex items-center justify-center gap-2 cursor-pointer"
              >
                <IconRotateCcw className="w-5 h-5 text-stone-500" />
                <span>기록 안 남기고 다시 하기</span>
              </button>
            </div>

            {nextAction && isSaved && (
              <div className="pt-2 text-center">
                {nextAction}
              </div>
            )}
          </form>

          <RecordsModal
            isOpen={showLeaderboard}
            onClose={() => setShowLeaderboard(false)}
            highlightedId={justSavedId}
          />
        </div>
      );
    };

    // ==========================================
    // 7. VIRTUAL KEYBOARD COMPONENT
    // ==========================================
    const KEYBOARD_ROWS = [
      ['q', 'w', 'e', 'r', 't', 'y', 'u', 'i', 'o', 'p'],
      ['a', 's', 'd', 'f', 'g', 'h', 'j', 'k', 'l'],
      ['z', 'x', 'c', 'v', 'b', 'n', 'm']
    ];

    const VirtualKeyboard = ({ activeKey = '', nextChar = '', onKeyClick }) => (
      <div className="bg-stone-100/90 border border-stone-200/90 rounded-2xl p-3 sm:p-4 shadow-2xs max-w-2xl mx-auto select-none">
        <div className="space-y-1.5 sm:space-y-2">
          {KEYBOARD_ROWS.map((row, rIdx) => (
            <div key={rIdx} className="flex justify-center gap-1 sm:gap-1.5">
              {row.map(key => {
                const isActive = activeKey.toLowerCase() === key;
                const isNext = nextChar.toLowerCase() === key;
                return (
                  <button
                    key={key}
                    type="button"
                    onClick={() => onKeyClick && onKeyClick(key)}
                    className={`h-9 sm:h-11 min-w-[28px] sm:min-w-[42px] px-2 sm:px-3 text-xs sm:text-sm font-mono font-bold rounded-xl transition-all uppercase flex items-center justify-center ${
                      isActive
                        ? 'bg-amber-600 text-white shadow-sm scale-95 ring-2 ring-amber-400'
                        : isNext
                        ? 'bg-amber-100 text-amber-900 border-2 border-amber-500 shadow-xs animate-pulse'
                        : 'bg-white text-stone-800 border border-stone-200/80 hover:bg-stone-50 active:scale-95'
                    }`}
                  >
                    {key}
                  </button>
                );
              })}
            </div>
          ))}
        </div>
      </div>
    );

    // ==========================================
    // 8. TIER PROMOTION MODE (단계별 승급전)
    // ==========================================
    const TierPromotionMode = ({ onOpenVocab }) => {
      const [progress, setProgress] = useState(() => {
        try {
          const raw = localStorage.getItem('travel_typing_tier_progress');
          if (raw) return JSON.parse(raw);
        } catch(e) {}
        return {
          currentTierLevel: 1,
          records: {
            1: { unlocked: true, stars: 0, bestCpm: 0, bestAccuracy: 0 },
            2: { unlocked: false, stars: 0, bestCpm: 0, bestAccuracy: 0 },
            3: { unlocked: false, stars: 0, bestCpm: 0, bestAccuracy: 0 },
            4: { unlocked: false, stars: 0, bestCpm: 0, bestAccuracy: 0 },
            5: { unlocked: false, stars: 0, bestCpm: 0, bestAccuracy: 0 }
          }
        };
      });

      const [selectedTier, setSelectedTier] = useState(STAGE_TIERS[0]);
      const [gameState, setGameState] = useState('SELECT');
      const [showLeaderboard, setShowLeaderboard] = useState(false);

      const [stageWords, setStageWords] = useState([]);
      const [wordIdx, setWordIdx] = useState(0);
      const [typedInput, setTypedInput] = useState('');
      const [isError, setIsError] = useState(false);
      const [lastKeyPressed, setLastKeyPressed] = useState('');

      const [startTime, setStartTime] = useState(null);
      const [elapsedSeconds, setElapsedSeconds] = useState(0);
      const [correctKeystrokes, setCorrectKeystrokes] = useState(0);
      const [totalKeystrokes, setTotalKeystrokes] = useState(0);
      const [currentCombo, setCurrentCombo] = useState(0);
      const [maxCombo, setMaxCombo] = useState(0);

      const [passedPromotion, setPassedPromotion] = useState(false);
      const [earnedStars, setEarnedStars] = useState(0);
      const [resultCpm, setResultCpm] = useState(0);
      const [resultAccuracy, setResultAccuracy] = useState(0);

      const [showKeyboard, setShowKeyboard] = useState(true);
      const [autoSpeak, setAutoSpeak] = useState(true);

      const inputRef = useRef(null);
      const timerRef = useRef(null);

      const totalStars = Object.values(progress.records).reduce((sum, r) => sum + (r.stars || 0), 0);
      const currentWord = stageWords[wordIdx] || stageWords[0];
      const targetWord = currentWord ? currentWord.word.toLowerCase() : '';

      const focusInput = () => inputRef.current?.focus();

      const startStage = (tier) => {
        setSelectedTier(tier);
        const words = getWordsForTier(tier);
        setStageWords(words);
        setWordIdx(0);
        setTypedInput('');
        setIsError(false);
        setStartTime(null);
        setElapsedSeconds(0);
        setCorrectKeystrokes(0);
        setTotalKeystrokes(0);
        setCurrentCombo(0);
        setMaxCombo(0);
        setGameState('PLAYING');

        setTimeout(() => {
          focusInput();
          if (autoSpeak && words[0]) {
            soundController.speakEnglish(words[0].word);
          }
        }, 60);
      };

      useEffect(() => {
        if (gameState === 'PLAYING' && startTime) {
          timerRef.current = window.setInterval(() => {
            setElapsedSeconds(Math.floor((Date.now() - startTime) / 1000));
          }, 500);
        }
        return () => {
          if (timerRef.current) clearInterval(timerRef.current);
        };
      }, [gameState, startTime]);

      useEffect(() => {
        if (gameState === 'PLAYING' && autoSpeak && currentWord) {
          soundController.speakEnglish(currentWord.word);
        }
      }, [wordIdx, gameState, autoSpeak, currentWord]);

      const handleStageComplete = useCallback((finalCorrect, finalTotal, durationSec) => {
        const minutes = Math.max(durationSec / 60, 0.05);
        const finalCpm = Math.round(finalCorrect / minutes);
        const finalAccuracy = finalTotal > 0 ? Math.round((finalCorrect / finalTotal) * 100) : 100;

        setResultCpm(finalCpm);
        setResultAccuracy(finalAccuracy);

        const meetsCpm = finalCpm >= selectedTier.minCpm;
        const meetsAccuracy = finalAccuracy >= selectedTier.minAccuracy;
        const passed = meetsCpm && meetsAccuracy;

        setPassedPromotion(passed);

        let stars = 0;
        if (passed) {
          if (
            finalCpm >= selectedTier.starThresholds.threeStar.minCpm &&
            finalAccuracy >= selectedTier.starThresholds.threeStar.minAccuracy
          ) {
            stars = 3;
          } else if (
            finalCpm >= selectedTier.starThresholds.twoStar.minCpm &&
            finalAccuracy >= selectedTier.starThresholds.twoStar.minAccuracy
          ) {
            stars = 2;
          } else {
            stars = 1;
          }

          soundController.playPromotion();
          try {
            confetti({ particleCount: 100, spread: 80, origin: { y: 0.55 } });
          } catch(e) {}

          setProgress(prev => {
            const currentRec = prev.records[selectedTier.level] || { unlocked: true, stars: 0, bestCpm: 0, bestAccuracy: 0 };
            const updatedRecs = {
              ...prev.records,
              [selectedTier.level]: {
                ...currentRec,
                stars: Math.max(currentRec.stars, stars),
                bestCpm: Math.max(currentRec.bestCpm, finalCpm),
                bestAccuracy: Math.max(currentRec.bestAccuracy, finalAccuracy),
                clearedAt: new Date().toISOString()
              }
            };
            const nextLevel = selectedTier.level + 1;
            if (nextLevel <= STAGE_TIERS.length) {
              updatedRecs[nextLevel] = {
                ...(updatedRecs[nextLevel] || { stars: 0, bestCpm: 0, bestAccuracy: 0 }),
                unlocked: true
              };
            }
            const newProg = {
              currentTierLevel: Math.min(Math.max(prev.currentTierLevel, nextLevel), STAGE_TIERS.length),
              records: updatedRecs
            };
            try {
              localStorage.setItem('travel_typing_tier_progress', JSON.stringify(newProg));
            } catch(e) {}
            return newProg;
          });
        } else {
          soundController.playTypo();
        }

        setEarnedStars(stars);
        setGameState('RESULT');
      }, [selectedTier]);

      const handleInputChange = (e) => {
        if (gameState !== 'PLAYING') return;
        const value = e.target.value.toLowerCase();
        const currStartTime = startTime || Date.now();
        if (!startTime) setStartTime(currStartTime);

        if (value.length > typedInput.length) {
          const addedChar = value[value.length - 1];
          setLastKeyPressed(addedChar);
          const newTotal = totalKeystrokes + 1;
          setTotalKeystrokes(newTotal);

          const expectedPrefix = targetWord.slice(0, value.length);
          if (value === expectedPrefix) {
            soundController.playKeyClick();
            setIsError(false);
            setTypedInput(value);
            const newCorrect = correctKeystrokes + 1;
            setCorrectKeystrokes(newCorrect);
            setCurrentCombo(prev => {
              const next = prev + 1;
              if (next > maxCombo) setMaxCombo(next);
              return next;
            });

            if (value === targetWord) {
              soundController.playWordSuccess();

              // [테스트 모드 지원] 첫 번째 단계 첫 단어만 입력해도 바로 결과/기록 화면으로 이동
              const TEST_MODE_SINGLE_WORD = true;
              if (TEST_MODE_SINGLE_WORD && selectedTier.level === 1) {
                const totalDuration = Math.max(Math.floor((Date.now() - currStartTime) / 1000), 2);
                handleStageComplete(Math.max(newCorrect, 15), Math.max(newTotal, 15), totalDuration);
                return;
              }

              if (wordIdx < stageWords.length - 1) {
                setWordIdx(prev => prev + 1);
                setTypedInput('');
              } else {
                const totalDuration = Math.max(Math.floor((Date.now() - currStartTime) / 1000), 1);
                handleStageComplete(newCorrect, newTotal, totalDuration);
              }
            }
          } else {
            soundController.playTypo();
            setIsError(true);
            setCurrentCombo(0);
            setTimeout(() => setIsError(false), 220);
          }
        } else {
          setTypedInput(value);
          setIsError(false);
        }
      };

      const nextChar = targetWord[typedInput.length] || '';
      const playerCurrentTier = STAGE_TIERS.find(t => t.level === progress.currentTierLevel) || STAGE_TIERS[0];

      return (
        <div className="w-full max-w-5xl mx-auto px-4 py-6">
          {/* Header Status Card */}
          <div className="bg-white border border-stone-200/90 rounded-3xl p-5 sm:p-6 shadow-xs mb-8">
            <div className="flex flex-col md:flex-row items-start md:items-center justify-between gap-4 border-b border-stone-100 pb-5">
              <div className="flex items-center gap-3.5">
                <div className="w-12 h-12 rounded-2xl bg-gradient-to-br from-amber-500 to-amber-700 text-white flex items-center justify-center text-xl shadow-sm font-bold">
                  {playerCurrentTier.badgeIcon}
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <span className="text-xs font-bold text-amber-700 uppercase tracking-wider">CURRENT BOARDING CLASS</span>
                    <span className="text-xs text-stone-400">·</span>
                    <span className="text-xs text-stone-500">LEVEL {progress.currentTierLevel} / {STAGE_TIERS.length}</span>
                  </div>
                  <h2 className="text-xl sm:text-2xl font-black text-stone-900 tracking-tight">{playerCurrentTier.className}</h2>
                  <p className="text-xs text-stone-500">칭호: <strong className="text-amber-800">{playerCurrentTier.travelerTitle}</strong></p>
                </div>
              </div>

              <div className="flex items-center gap-4 bg-stone-50 border border-stone-200/80 rounded-2xl px-5 py-3 shrink-0">
                <div className="text-center">
                  <span className="text-[10px] text-stone-400 block font-semibold">총 획득 별</span>
                  <div className="flex items-center gap-1 text-amber-500 font-bold text-base">
                    <IconStar className="w-4 h-4 fill-amber-500 text-amber-500" fill={true} />
                    <span className="font-mono text-stone-900">{totalStars}</span>
                    <span className="text-xs text-stone-400">/ 15</span>
                  </div>
                </div>
                <div className="w-px h-8 bg-stone-200" />
                <div className="text-center">
                  <span className="text-[10px] text-stone-400 block font-semibold">승급 완료율</span>
                  <span className="font-mono font-bold text-base text-emerald-700">
                    {Math.round((Object.values(progress.records).filter(r => r.stars > 0).length / STAGE_TIERS.length) * 100)}%
                  </span>
                </div>
              </div>
            </div>

            {/* Level progression steps */}
            <div className="pt-5">
              <div className="flex items-center justify-between text-xs font-semibold text-stone-500 mb-2">
                <span>단계별 승급 여정 (인천 ✈️ 뉴욕)</span>
                <span>{Object.values(progress.records).filter(r => r.stars > 0).length} / {STAGE_TIERS.length} 클래스 통과</span>
              </div>
              <div className="grid grid-cols-5 gap-2 sm:gap-3">
                {STAGE_TIERS.map(tier => {
                  const rec = progress.records[tier.level];
                  const isUnlocked = rec?.unlocked;
                  const isCurrent = tier.level === selectedTier.level && gameState === 'PLAYING';
                  const stars = rec?.stars || 0;
                  return (
                    <button
                      key={tier.level}
                      onClick={() => isUnlocked && startStage(tier)}
                      disabled={!isUnlocked}
                      className={`relative p-2.5 sm:p-3 rounded-2xl text-left border transition-all ${
                        isCurrent
                          ? 'border-amber-500 bg-amber-50/50 ring-2 ring-amber-500/20'
                          : isUnlocked
                          ? 'border-stone-200 bg-white hover:border-amber-300 hover:bg-stone-50/60 cursor-pointer'
                          : 'border-stone-200/60 bg-stone-100/70 text-stone-400 cursor-not-allowed opacity-60'
                      }`}
                    >
                      <div className="flex items-center justify-between mb-1">
                        <span className="text-xs font-bold font-mono">LV.{tier.level}</span>
                        {isUnlocked ? (
                          stars > 0 ? (
                            <div className="flex text-amber-500 text-[10px]">{'★'.repeat(stars)}</div>
                          ) : (
                            <span className="text-[10px] text-stone-400">도전</span>
                          )
                        ) : (
                          <IconLock className="w-3 h-3 text-stone-400" />
                        )}
                      </div>
                      <div className="text-[11px] sm:text-xs font-bold text-stone-900 truncate">{tier.seatBadge}</div>
                      <div className="text-[10px] text-stone-500 truncate mt-0.5">{tier.flag} {tier.airportCode}</div>
                    </button>
                  );
                })}
              </div>
            </div>
          </div>

          {/* 1. STAGE SELECTION VIEW */}
          {gameState === 'SELECT' && (
            <div className="space-y-4">
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                <div>
                  <h3 className="text-lg font-bold text-stone-900">도전할 승급 단계를 선택하세요</h3>
                  <span className="text-xs text-stone-500">목표 기준(타수 및 정확도)을 만족하면 다음 등급으로 승급됩니다</span>
                </div>
                <button
                  onClick={() => setShowLeaderboard(true)}
                  className="px-4 py-2.5 text-xs sm:text-sm font-bold text-amber-950 bg-amber-400 hover:bg-amber-500 border border-amber-500/80 rounded-xl shadow-xs transition-transform active:scale-95 flex items-center justify-center gap-1.5 cursor-pointer shrink-0"
                >
                  <span>🏆 명예의 전당</span>
                </button>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                {STAGE_TIERS.map(tier => {
                  const rec = progress.records[tier.level];
                  const isUnlocked = rec?.unlocked;
                  const stars = rec?.stars || 0;
                  const tierWords = getWordsForTier(tier);
                  return (
                    <div
                      key={tier.level}
                      className={`bg-white border rounded-3xl p-5 shadow-xs transition-all flex flex-col justify-between ${
                        isUnlocked ? 'border-stone-200 hover:shadow-md hover:border-amber-400' : 'border-stone-200/60 bg-stone-50/50 opacity-60'
                      }`}
                    >
                      <div>
                        <div className="flex items-center justify-between mb-3 text-xs">
                          <div className="flex items-center gap-1.5">
                            <span className="text-base">{tier.badgeIcon}</span>
                            <span className="font-bold text-amber-900">{tier.seatBadge}</span>
                          </div>
                          <div className="flex items-center gap-1">
                            {isUnlocked ? (
                              <div className="flex text-amber-500 text-xs">
                                {[1, 2, 3].map(s => (
                                  <IconStar key={s} className="w-3.5 h-3.5" fill={s <= stars} />
                                ))}
                              </div>
                            ) : (
                              <span className="text-stone-400 text-xs flex items-center gap-1">
                                <IconLock className="w-3 h-3" /> 잠김
                              </span>
                            )}
                          </div>
                        </div>

                        <h4 className="text-base font-bold text-stone-900 mb-1">{tier.className}</h4>
                        <p className="text-xs text-stone-500 mb-3">{tier.destination} · {tier.summary}</p>

                        <div className="bg-stone-50 rounded-2xl p-3 border border-stone-100 mb-4 space-y-1.5">
                          <span className="text-[10px] font-semibold text-stone-500 block mb-1">출제 단어 & 한글 뜻:</span>
                          {tierWords.map(w => (
                            <div key={w.id} className="flex items-baseline justify-between text-xs">
                              <strong className="font-mono text-stone-900">{w.word}</strong>
                              <span className="text-amber-800 font-medium">{w.meaning}</span>
                            </div>
                          ))}
                        </div>

                        <div className="flex items-center justify-between text-[11px] text-stone-500 pt-1 border-t border-stone-100">
                          <span>승급 기준:</span>
                          <span className="font-mono font-semibold text-stone-700">
                            {tier.minCpm} CPM 이상 · 정확도 {tier.minAccuracy}% 이상
                          </span>
                        </div>
                      </div>

                      <div className="mt-5">
                        {isUnlocked ? (
                          <button
                            onClick={() => startStage(tier)}
                            className="w-full py-2.5 px-4 text-xs font-bold text-white bg-amber-600 rounded-xl hover:bg-amber-700 shadow-sm transition-transform active:scale-98 flex items-center justify-center gap-1.5 cursor-pointer"
                          >
                            <IconPlay className="w-3.5 h-3.5" />
                            <span>{stars > 0 ? '승급전 다시 도전' : '승급 심사 시작'}</span>
                          </button>
                        ) : (
                          <div className="w-full py-2.5 px-4 text-xs font-semibold text-stone-400 bg-stone-100 rounded-xl text-center flex items-center justify-center gap-1.5">
                            <IconLock className="w-3.5 h-3.5" />
                            <span>이전 단계를 통과해야 해금됩니다</span>
                          </div>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {/* 2. ACTIVE TYPING PLAYING VIEW */}
          {gameState === 'PLAYING' && (
            <div className="space-y-4" onClick={focusInput}>
              <div className="bg-white border border-stone-200 rounded-2xl p-4 sm:p-5 shadow-xs flex flex-wrap items-center justify-between gap-4">
                <div className="flex items-center gap-3">
                  <span className="text-2xl">{selectedTier.badgeIcon}</span>
                  <div>
                    <div className="flex items-center gap-2">
                      <span className="text-xs font-bold text-amber-700">LEVEL {selectedTier.level}</span>
                      <span className="text-xs text-stone-400">·</span>
                      <span className="text-xs text-stone-600">{selectedTier.destination}</span>
                    </div>
                    <h3 className="text-base sm:text-lg font-bold text-stone-900">{selectedTier.className} 승급 심사</h3>
                  </div>
                </div>

                <div className="flex items-center gap-4 text-xs">
                  <div className="bg-amber-50 border border-amber-200 text-amber-800 px-3 py-1.5 rounded-xl font-medium">
                    기준: <strong className="font-mono">{selectedTier.minCpm} CPM</strong> · 정확도 <strong className="font-mono">{selectedTier.minAccuracy}%</strong>
                  </div>
                  <button
                    type="button"
                    onClick={() => setGameState('SELECT')}
                    className="text-stone-400 hover:text-stone-700 text-xs px-2.5 py-1.5 rounded-lg border border-stone-200"
                  >
                    단계 목록
                  </button>
                </div>
              </div>

              <div className={`relative bg-white border rounded-3xl p-6 sm:p-10 shadow-sm transition-all duration-150 ${isError ? 'border-rose-400 bg-rose-50/20 animate-shake' : 'border-stone-200'}`}>
                {/* Test Mode Banner */}
                {selectedTier.level === 1 && (
                  <div className="mb-4 p-2.5 px-4 bg-amber-500/10 border border-amber-300/80 rounded-xl text-xs text-amber-900 font-semibold flex items-center gap-2">
                    <span>⚡</span>
                    <span><strong>[빠른 테스트 지원]</strong> 1단계 첫 단어(<strong className="font-mono underline">help</strong>)만 타이핑하면 즉시 결과 및 기록 화면으로 전환됩니다.</span>
                  </div>
                )}

                <div className="flex items-center justify-between text-xs text-stone-500 mb-6">
                  <div className="flex items-center gap-2">
                    <span className="font-mono font-semibold text-stone-700">단어 {wordIdx + 1} / {stageWords.length}</span>
                    <span className="text-stone-300">·</span>
                    <span className="text-amber-800 font-medium">{currentWord?.category}</span>
                  </div>
                  <div className="flex items-center gap-3">
                    <button
                      type="button"
                      onClick={(e) => { e.stopPropagation(); if (currentWord) soundController.speakEnglish(currentWord.word); }}
                      className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold text-stone-700 bg-stone-100 hover:bg-stone-200 cursor-pointer"
                    >
                      <IconVolume2 className="w-3.5 h-3.5 text-amber-600" />
                      <span>발음 듣기</span>
                    </button>
                    <button
                      type="button"
                      onClick={(e) => { e.stopPropagation(); startStage(selectedTier); }}
                      className="text-stone-400 hover:text-stone-700 p-1.5 rounded-lg"
                      title="처음부터 다시하기"
                    >
                      <IconRotateCcw className="w-4 h-4" />
                    </button>
                  </div>
                </div>

                {/* Target Letters & Korean Meaning Underneath */}
                <div className="text-center py-6">
                  <div className="font-mono text-5xl sm:text-7xl font-bold tracking-wider select-none mb-3">
                    {targetWord.split('').map((char, index) => {
                      const isTyped = index < typedInput.length;
                      const isCurrent = index === typedInput.length;
                      return (
                        <span
                          key={index}
                          className={`inline-block transition-colors duration-100 ${
                            isTyped ? 'text-emerald-600 font-extrabold' : isCurrent ? 'text-stone-900 border-b-4 border-amber-500 animate-pulse' : 'text-stone-300'
                          }`}
                        >
                          {char}
                        </span>
                      );
                    })}
                  </div>

                  <div className="space-y-1.5">
                    <div className="text-2xl sm:text-3xl font-extrabold text-stone-900">{currentWord?.meaning}</div>
                    <div className="text-sm sm:text-base font-medium text-amber-800">{currentWord?.pronunciation}</div>
                    <p className="text-xs sm:text-sm text-stone-500 max-w-md mx-auto pt-1">💡 {currentWord?.tip}</p>
                  </div>

                  <div className="mt-5 p-3 sm:p-4 bg-stone-50 border border-stone-200/80 rounded-2xl max-w-xl mx-auto text-left flex items-start gap-3">
                    <button
                      type="button"
                      onClick={(e) => { e.stopPropagation(); if (currentWord) soundController.speakEnglish(currentWord.exampleSentence); }}
                      className="p-2 rounded-xl bg-white border border-stone-200 text-stone-600 hover:text-amber-600 shrink-0"
                    >
                      <IconVolume2 className="w-4 h-4" />
                    </button>
                    <div className="space-y-0.5">
                      <p className="text-xs sm:text-sm font-semibold text-stone-900">"{currentWord?.exampleSentence}"</p>
                      <p className="text-xs text-stone-600">"{currentWord?.exampleTranslation}"</p>
                    </div>
                  </div>
                </div>

                {/* Typing Input */}
                <div className="max-w-md mx-auto mt-4">
                  <div className="relative">
                    <input
                      ref={inputRef}
                      type="text"
                      value={typedInput}
                      onChange={handleInputChange}
                      autoComplete="off"
                      autoCorrect="off"
                      autoCapitalize="none"
                      spellCheck="false"
                      placeholder="영단어를 타이핑하세요..."
                      className="w-full py-3 px-5 text-center text-lg font-mono font-medium rounded-xl border border-stone-300 focus:outline-none focus:ring-2 focus:ring-amber-500 bg-stone-50/50 shadow-inner"
                    />
                    {isError && (
                      <span className="absolute right-3 top-1/2 -translate-y-1/2 text-xs font-semibold text-rose-600">오타!</span>

                  </div>
                </div>

                {/* Metrics */}
                <div className="grid grid-cols-4 gap-2 sm:gap-4 mt-8 pt-6 border-t border-stone-100 text-center">
                  <div>
                    <span className="text-[11px] text-stone-500 block">현재 타수</span>
                    <span className="text-lg sm:text-xl font-bold font-mono text-stone-900">
                      {startTime ? Math.round(correctKeystrokes / Math.max(elapsedSeconds / 60, 0.05)) : 0}
                      <span className="text-xs font-normal text-stone-400 ml-1">CPM</span>
                    </span>
                  </div>
                  <div>
                    <span className="text-[11px] text-stone-500 block">정확도</span>
                    <span className="text-lg sm:text-xl font-bold font-mono text-emerald-700">
                      {totalKeystrokes > 0 ? Math.round((correctKeystrokes / totalKeystrokes) * 100) : 100}%

                  <div>
                    <span className="text-[11px] text-stone-500 block">연속 콤보</span>
                    <span className="text-lg sm:text-xl font-bold font-mono text-amber-600">{currentCombo}</span>

                  <div>
                    <span className="text-[11px] text-stone-500 block">경과 시간</span>
                    <span className="text-lg sm:text-xl font-bold font-mono text-stone-700">{elapsedSeconds}s</span>

              </div>

              {/* Keyboard toggle & Virtual Keyboard */}
              <div className="flex items-center justify-between text-xs text-stone-500 px-2">
                <label className="flex items-center gap-1.5 cursor-pointer">
                  <input type="checkbox" checked={autoSpeak} onChange={(e) => setAutoSpeak(e.target.checked)} className="rounded text-amber-600" />

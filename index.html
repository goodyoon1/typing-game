                </label>
                <button onClick={() => setShowKeyboard(prev => !prev)} className="text-stone-500 hover:text-stone-800">
                  {showKeyboard ? '가상 키보드 접기' : '가상 키보드 보기'}
                </button>
              </div>

              {showKeyboard && (
                <VirtualKeyboard
                  activeKey={lastKeyPressed}
                  nextChar={nextChar}
                  onKeyClick={(key) => {
                    const nextVal = (typedInput + key).toLowerCase();
                    handleInputChange({ target: { value: nextVal } });
                  }}
                />
              )}
            </div>
          )}

          {/* 3. PROMOTION RESULT VIEW */}
          {gameState === 'RESULT' && (
            <div className="max-w-2xl mx-auto bg-white border border-stone-200 rounded-3xl p-6 sm:p-8 shadow-xl text-center animate-fade-in">
              {passedPromotion ? (
                <div>
                  <div className="w-16 h-16 rounded-full bg-amber-100 text-amber-700 flex items-center justify-center text-3xl mx-auto mb-3">
                    {selectedTier.badgeIcon}
                  </div>
                  <div className="flex items-center justify-center gap-1 text-amber-500 mb-2">
                    {[1, 2, 3].map(s => (
                      <IconStar key={s} className="w-6 h-6" fill={s <= earnedStars} />
                    ))}
                  </div>
                  <span className="text-xs font-bold text-amber-700 uppercase tracking-widest block mb-1">PROMOTION SUCCESSFUL!</span>
                  <h3 className="text-2xl sm:text-3xl font-black text-stone-900 tracking-tight mb-2">
                    🎉 {selectedTier.className} 승급 완료!
                  </h3>
                  <p className="text-sm text-stone-600 max-w-md mx-auto mb-6">
                    축하합니다! 새로운 여행자 칭호 <strong className="text-amber-800">[{selectedTier.travelerTitle}]</strong>를 획득했습니다.
                  </p>

                  {/* Score boxes */}
                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 max-w-lg mx-auto mb-6">
                    <div className="p-3 bg-stone-50 rounded-2xl border border-stone-200">
                      <span className="text-[11px] text-stone-500 block">기록 타수</span>
                      <span className="text-xl font-bold font-mono text-stone-900">{resultCpm}</span>
                      <span className="text-[10px] text-stone-400 block">기준: {selectedTier.minCpm}</span>
                    </div>
                    <div className="p-3 bg-stone-50 rounded-2xl border border-stone-200">
                      <span className="text-[11px] text-stone-500 block">기록 정확도</span>
                      <span className="text-xl font-bold font-mono text-emerald-700">{resultAccuracy}%</span>
                      <span className="text-[10px] text-stone-400 block">기준: {selectedTier.minAccuracy}%</span>
                    </div>
                    <div className="p-3 bg-stone-50 rounded-2xl border border-stone-200">
                      <span className="text-[11px] text-stone-500 block">최대 콤보</span>
                      <span className="text-xl font-bold font-mono text-amber-600">{maxCombo}</span>
                      <span className="text-[10px] text-stone-400 block">연속 성공</span>
                    </div>
                    <div className="p-3 bg-stone-50 rounded-2xl border border-stone-200">
                      <span className="text-[11px] text-stone-500 block">소요 시간</span>
                      <span className="text-xl font-bold font-mono text-stone-700">{elapsedSeconds}s</span>
                      <span className="text-[10px] text-stone-400 block">3단어 완주</span>
                    </div>
                  </div>

                  {/* Record Submission Section */}
                  <GameResultRecordSection
                    score={`${resultCpm} CPM (정확도 ${resultAccuracy}%)`}
                    onRestartWithoutSaving={() => startStage(selectedTier)}
                    nextAction={
                      selectedTier.level < STAGE_TIERS.length ? (
                        <button
                          onClick={() => {
                            const nextTier = STAGE_TIERS.find(t => t.level === selectedTier.level + 1);
                            if (nextTier) startStage(nextTier);
                          }}
                          className="w-full sm:w-auto px-6 py-3 text-base sm:text-lg font-bold text-white bg-amber-600 hover:bg-amber-700 rounded-xl shadow-sm transition-transform active:scale-95 flex items-center justify-center gap-1.5 cursor-pointer"
                        >
                          <span>다음 클래스로 승급하기</span>
                          <IconArrowRight className="w-4 h-4" />
                        </button>
                      ) : (
                        <button
                          onClick={onOpenVocab}
                          className="w-full sm:w-auto px-6 py-3 text-base sm:text-lg font-bold text-white bg-amber-600 hover:bg-amber-700 rounded-xl shadow-sm transition-transform active:scale-95 flex items-center justify-center gap-1.5 cursor-pointer"
                        >
                          <span>전체 15단어 여행 사전 복습하기</span>
                          <IconArrowRight className="w-4 h-4" />
                        </button>
                      )
                    }
                  />
                </div>
              ) : (
                <div>
                  <div className="w-16 h-16 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center text-3xl mx-auto mb-3">
                    ⚠️
                  </div>
                  <span className="text-xs font-bold text-rose-600 uppercase tracking-widest block mb-1">PROMOTION NOT REACHED</span>
                  <h3 className="text-2xl font-bold text-stone-900 mb-2">승급 기준에 아쉽게 도달하지 못했습니다</h3>
                  <p className="text-xs sm:text-sm text-stone-600 max-w-md mx-auto mb-6">
                    승급 기준: 타수 <strong>{selectedTier.minCpm} CPM</strong> 이상, 정확도 <strong>{selectedTier.minAccuracy}%</strong> 이상이 필요해요.
                  </p>

                  <div className="grid grid-cols-2 gap-3 max-w-xs mx-auto mb-6">
                    <div className="p-3 rounded-2xl border bg-stone-50 border-stone-200">
                      <span className="text-[10px] block opacity-80">내 타수</span>
                      <span className="text-lg font-bold font-mono">{resultCpm} CPM</span>
                    </div>
                    <div className="p-3 rounded-2xl border bg-stone-50 border-stone-200">
                      <span className="text-[10px] block opacity-80">내 정확도</span>
                      <span className="text-lg font-bold font-mono">{resultAccuracy}%</span>
                    </div>
                  </div>

                  <GameResultRecordSection
                    score={`${resultCpm} CPM (정확도 ${resultAccuracy}%)`}
                    onRestartWithoutSaving={() => startStage(selectedTier)}
                    nextAction={
                      <button
                        onClick={() => setGameState('SELECT')}
                        className="w-full sm:w-auto px-5 py-3 text-base sm:text-lg font-semibold text-stone-600 bg-stone-100 hover:bg-stone-200 rounded-xl transition-colors cursor-pointer"
                      >
                        단계 목록으로
                      </button>
                    }
                  />
                </div>
              )}
            </div>
          )}

          <RecordsModal isOpen={showLeaderboard} onClose={() => setShowLeaderboard(false)} />
        </div>
      );
    };

    // ==========================================
    // 9. JOURNEY MODE (15단어 완주 여정)
    // ==========================================
    const PassportModal = ({ isOpen, onRestart, onOpenVocab, words, elapsedSeconds, correctKeystrokes, totalKeystrokes, maxCombo, cpm }) => {
      if (!isOpen) return null;
      const accuracy = totalKeystrokes > 0 ? Math.round((correctKeystrokes / totalKeystrokes) * 100) : 100;
      let grade = 'A';
      if (accuracy >= 95 && cpm >= 200) grade = 'S';
      else if (accuracy >= 85) grade = 'A';
      else grade = 'B';

      const formatTime = (secs) => {
        const mins = Math.floor(secs / 60);
        const rem = secs % 60;
        return `${mins > 0 ? `${mins}분 ` : ''}${rem}초`;
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-stone-900/60 backdrop-blur-sm animate-fade-in">
          <div className="relative w-full max-w-2xl bg-[#FCFAF7] border border-amber-900/20 rounded-3xl shadow-2xl overflow-hidden p-6 sm:p-8 max-h-[90vh] overflow-y-auto">
            <div className="flex items-center justify-between border-b border-stone-200 pb-4 mb-6">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-amber-900 text-amber-100 flex items-center justify-center font-bold text-lg shadow-sm">
                  ✈
                </div>
                <div>
                  <h2 className="text-xl font-bold tracking-tight text-stone-900">여행 영어 타자 여권 스탬프 완주증</h2>
                  <p className="text-xs text-stone-500">PASSPORT STAMP CERTIFICATE · 15 TRAVEL WORDS</p>
                </div>
              </div>
              <div className="text-right">
                <span className="text-2xl font-black text-amber-600 font-mono tracking-wider">GRADE {grade}</span>
              </div>
            </div>

            <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6">
              <div className="p-3 bg-white rounded-xl border border-stone-200 text-center">
                <span className="text-xs text-stone-500 block">타수 (CPM)</span>
                <span className="text-xl font-bold font-mono text-stone-900">{cpm}</span>
              </div>
              <div className="p-3 bg-white rounded-xl border border-stone-200 text-center">
                <span className="text-xs text-stone-500 block">정확도</span>
                <span className="text-xl font-bold font-mono text-emerald-700">{accuracy}%</span>
              </div>
              <div className="p-3 bg-white rounded-xl border border-stone-200 text-center">
                <span className="text-xs text-stone-500 block">소요 시간</span>
                <span className="text-xl font-bold font-mono text-stone-900">{formatTime(elapsedSeconds)}</span>
              </div>
              <div className="p-3 bg-white rounded-xl border border-stone-200 text-center">
                <span className="text-xs text-stone-500 block">최대 콤보</span>
                <span className="text-xl font-bold font-mono text-amber-700">{maxCombo}</span>
              </div>
            </div>

            <GameResultRecordSection
              score={`${cpm} CPM (정확도 ${accuracy}%)`}
              onRestartWithoutSaving={onRestart}
              nextAction={
                <button
                  onClick={onOpenVocab}
                  className="w-full sm:w-auto px-5 py-3 text-base sm:text-lg font-bold text-stone-700 bg-white border-2 border-stone-300 hover:bg-stone-50 rounded-xl transition-colors flex items-center justify-center gap-1.5 cursor-pointer"
                >
                  <IconBookOpen className="w-5 h-5 text-stone-500" />
                  <span>15단어 뜻 & 발음 복습하기</span>
                </button>
              }
            />
          </div>
        </div>
      );
    };

    const JourneyMode = ({ onOpenVocab }) => {
      const [wordIndex, setWordIndex] = useState(0);
      const [typedInput, setTypedInput] = useState('');
      const [isError, setIsError] = useState(false);
      const [lastKeyPressed, setLastKeyPressed] = useState('');

      const [correctKeystrokes, setCorrectKeystrokes] = useState(0);
      const [totalKeystrokes, setTotalKeystrokes] = useState(0);
      const [currentCombo, setCurrentCombo] = useState(0);
      const [maxCombo, setMaxCombo] = useState(0);
      const [startTime, setStartTime] = useState(null);
      const [elapsedSeconds, setElapsedSeconds] = useState(0);
      const [isCompleted, setIsCompleted] = useState(false);

      const [autoSpeak, setAutoSpeak] = useState(true);
      const [showKeyboard, setShowKeyboard] = useState(true);

      const inputRef = useRef(null);
      const timerRef = useRef(null);

      const currentWord = TRAVEL_WORDS[wordIndex] || TRAVEL_WORDS[0];
      const targetWord = currentWord.word.toLowerCase();

      useEffect(() => {
        if (autoSpeak && !isCompleted) soundController.speakEnglish(currentWord.word);
      }, [wordIndex, autoSpeak, currentWord.word, isCompleted]);

      useEffect(() => {
        if (startTime && !isCompleted) {
          timerRef.current = window.setInterval(() => {
            setElapsedSeconds(Math.floor((Date.now() - startTime) / 1000));
          }, 500);
        }
        return () => { if (timerRef.current) clearInterval(timerRef.current); };
      }, [startTime, isCompleted]);

      const focusInput = () => inputRef.current?.focus();

      useEffect(() => { focusInput(); }, [wordIndex, isCompleted]);

      const handleGameComplete = useCallback(() => {
        setIsCompleted(true);
        soundController.playVictory();
        try { confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } }); } catch(e) {}
      }, []);

      const resetGame = () => {
        setWordIndex(0);
        setTypedInput('');
        setIsError(false);
        setCorrectKeystrokes(0);
        setTotalKeystrokes(0);
        setCurrentCombo(0);
        setMaxCombo(0);
        setStartTime(null);
        setElapsedSeconds(0);
        setIsCompleted(false);
        focusInput();
      };

      const handleInputChange = (e) => {
        const value = e.target.value.toLowerCase();
        if (!startTime) setStartTime(Date.now());

        if (value.length > typedInput.length) {
          const addedChar = value[value.length - 1];
          setLastKeyPressed(addedChar);
          setTotalKeystrokes(prev => prev + 1);

          const expectedPrefix = targetWord.slice(0, value.length);
          if (value === expectedPrefix) {
            soundController.playKeyClick();
            setIsError(false);
            setTypedInput(value);
            setCorrectKeystrokes(prev => prev + 1);
            setCurrentCombo(prev => {
              const next = prev + 1;
              if (next > maxCombo) setMaxCombo(next);
              return next;
            });

            if (value === targetWord) {
              soundController.playWordSuccess();

              // 빠른 테스트 지원: 첫 단어 완료 시 완주
              const TEST_MODE_SINGLE_WORD = true;
              if (TEST_MODE_SINGLE_WORD && wordIndex === 0) {
                handleGameComplete();
                return;
              }

              if (wordIndex < TRAVEL_WORDS.length - 1) {
                setWordIndex(prev => prev + 1);
                setTypedInput('');
              } else {
                handleGameComplete();
              }
            }
          } else {
            soundController.playTypo();
            setIsError(true);
            setCurrentCombo(0);
            setTimeout(() => setIsError(false), 250);
          }
        } else {
          setTypedInput(value);
          setIsError(false);
        }
      };

      const minutes = Math.max(elapsedSeconds / 60, 0.05);
      const liveCpm = startTime ? Math.round(correctKeystrokes / minutes) : 0;
      const liveAccuracy = totalKeystrokes > 0 ? Math.round((correctKeystrokes / totalKeystrokes) * 100) : 100;
      const nextChar = targetWord[typedInput.length] || '';

      const flightStops = [
        { code: 'ICN', city: '서울', targetIndex: 0 },
        { code: 'NRT', city: '도쿄', targetIndex: 3 },
        { code: 'BKK', city: '방콕', targetIndex: 7 },
        { code: 'CDG', city: '파리', targetIndex: 11 },
        { code: 'JFK', city: '뉴욕', targetIndex: 14 }
      ];

      return (
        <div className="w-full max-w-4xl mx-auto px-4 py-6" onClick={focusInput}>
          {/* Tracker HUD */}
          <div className="bg-white border border-stone-200/90 rounded-2xl p-4 sm:p-5 shadow-xs mb-6">
            <div className="flex items-center justify-between text-xs text-stone-500 mb-3">
              <span className="font-semibold text-stone-800">해외여행 비행 루트 · 단어 {wordIndex + 1} / {TRAVEL_WORDS.length}</span>
              <span className="font-mono">{Math.round(((wordIndex + (typedInput.length / targetWord.length)) / TRAVEL_WORDS.length) * 100)}% 완료</span>
            </div>
            <div className="h-1.5 bg-stone-100 rounded-full overflow-hidden mb-3">
              <div
                className="h-full bg-gradient-to-r from-amber-500 to-amber-600 transition-all duration-300"
                style={{ width: `${((wordIndex + (typedInput.length / targetWord.length)) / TRAVEL_WORDS.length) * 100}%` }}
              />
            </div>
            <div className="flex justify-between items-center text-xs">
              {flightStops.map(stop => (
                <div key={stop.code} className="flex flex-col items-center">
                  <span className={`font-mono text-xs ${wordIndex >= stop.targetIndex ? 'font-bold text-amber-700' : 'text-stone-400'}`}>{stop.code}</span>
                  <span className="text-[10px] text-stone-400">{stop.city}</span>
                </div>
              ))}
            </div>
          </div>

          {/* Typing Card */}
          <div className={`relative bg-white border rounded-3xl p-6 sm:p-10 shadow-sm transition-all duration-150 ${isError ? 'border-rose-400 bg-rose-50/20 animate-shake' : 'border-stone-200'}`}>
            <div className="flex items-center justify-between text-xs text-stone-500 mb-6">
              <span className="font-medium text-amber-700 bg-amber-50 px-2.5 py-1 rounded-md">{currentWord.category}</span>
              <div className="flex items-center gap-3">
                <button
                  type="button"
                  onClick={(e) => { e.stopPropagation(); soundController.speakEnglish(currentWord.word); }}
                  className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold text-stone-700 bg-stone-100 hover:bg-stone-200 cursor-pointer"
                >
                  <IconVolume2 className="w-3.5 h-3.5 text-amber-600" />
                  <span>발음 듣기</span>
                </button>
                <button type="button" onClick={(e) => { e.stopPropagation(); resetGame(); }} className="text-stone-400 hover:text-stone-700 p-1.5 rounded-lg">
                  <IconRotateCcw className="w-4 h-4" />
                </button>
              </div>
            </div>

            <div className="text-center py-4 sm:py-6">
              <div className="font-mono text-4xl sm:text-6xl md:text-7xl font-bold tracking-wider select-none mb-3">
                {targetWord.split('').map((char, index) => (
                  <span
                    key={index}
                    className={`inline-block transition-colors duration-100 ${
                      index < typedInput.length ? 'text-emerald-600 font-extrabold' : index === typedInput.length ? 'text-stone-900 border-b-4 border-amber-500 animate-pulse' : 'text-stone-300'
                    }`}
                  >
                    {char}
                  </span>
                ))}
              </div>

              <div className="space-y-1.5">
                <div className="text-2xl sm:text-3xl font-extrabold text-stone-900">{currentWord.meaning}</div>
                <div className="text-sm sm:text-base font-medium text-amber-800">{currentWord.pronunciation}</div>
                <p className="text-xs sm:text-sm text-stone-500 max-w-md mx-auto pt-1">💡 {currentWord.situation}</p>
              </div>

              <div className="mt-5 p-3 sm:p-4 bg-stone-50 border border-stone-200/80 rounded-2xl max-w-xl mx-auto text-left flex items-start gap-3">
                <button
                  type="button"
                  onClick={(e) => { e.stopPropagation(); soundController.speakEnglish(currentWord.exampleSentence); }}
                  className="p-2 rounded-xl bg-white border border-stone-200 text-stone-600 hover:text-amber-600 shrink-0"
                >
                  <IconVolume2 className="w-4 h-4" />
                </button>
                <div className="space-y-0.5">
                  <p className="text-xs sm:text-sm font-semibold text-stone-900">"{currentWord.exampleSentence}"</p>
                  <p className="text-xs text-stone-600">"{currentWord.exampleTranslation}"</p>
                </div>
              </div>
            </div>

            <div className="max-w-md mx-auto mt-4">
              <div className="relative">
                <input
                  ref={inputRef}
                  type="text"
                  value={typedInput}
                  onChange={handleInputChange}
                  autoComplete="off"
                  autoCorrect="off"
                  autoCapitalize="none"
                  spellCheck="false"
                  placeholder="여기에 영단어를 타이핑하세요..."
                  className="w-full py-3 px-5 text-center text-lg font-mono font-medium rounded-xl border border-stone-300 focus:outline-none focus:ring-2 focus:ring-amber-500 bg-stone-50/50 shadow-inner"
                />
                {isError && (
                  <span className="absolute right-3 top-1/2 -translate-y-1/2 text-xs font-semibold text-rose-600">오타!</span>
                )}
              </div>
            </div>

            <div className="grid grid-cols-4 gap-2 sm:gap-4 mt-8 pt-6 border-t border-stone-100 text-center">
              <div><span className="text-[11px] text-stone-500 block">타수 (CPM)</span><span className="text-lg sm:text-xl font-bold font-mono text-stone-900">{liveCpm}</span></div>
              <div><span className="text-[11px] text-stone-500 block">정확도</span><span className="text-lg sm:text-xl font-bold font-mono text-emerald-700">{liveAccuracy}%</span></div>
              <div><span className="text-[11px] text-stone-500 block">연속 콤보</span><span className="text-lg sm:text-xl font-bold font-mono text-amber-600">{currentCombo}</span></div>
              <div><span className="text-[11px] text-stone-500 block">경과 시간</span><span className="text-lg sm:text-xl font-bold font-mono text-stone-700">{elapsedSeconds}s</span></div>
            </div>
          </div>

          <div className="flex items-center justify-between text-xs text-stone-500 px-2 my-4">
            <label className="flex items-center gap-1.5 cursor-pointer">
              <input type="checkbox" checked={autoSpeak} onChange={(e) => setAutoSpeak(e.target.checked)} className="rounded text-amber-600" />
              <span>단어 전환 시 자동 발음</span>
            </label>
            <button onClick={() => setShowKeyboard(prev => !prev)} className="text-stone-500 hover:text-stone-800">
              {showKeyboard ? '가상 키보드 숨기기' : '가상 키보드 보기'}
            </button>
          </div>

          {showKeyboard && (
            <VirtualKeyboard
              activeKey={lastKeyPressed}
              nextChar={nextChar}
              onKeyClick={(key) => handleInputChange({ target: { value: (typedInput + key).toLowerCase() } })}
            />
          )}

          <PassportModal
            isOpen={isCompleted}
            onClose={() => setIsCompleted(false)}
            onRestart={resetGame}
            onOpenVocab={onOpenVocab}
            words={TRAVEL_WORDS}
            elapsedSeconds={elapsedSeconds}
            totalKeystrokes={totalKeystrokes}
            correctKeystrokes={correctKeystrokes}
            maxCombo={maxCombo}
            cpm={liveCpm}
          />
        </div>
      );
    };

    // ==========================================
    // 10. TIME ATTACK MODE (60초 러시)
    // ==========================================
    const TimeAttackMode = () => {
      const [gameState, setGameState] = useState('IDLE');
      const [showLeaderboard, setShowLeaderboard] = useState(false);
      const [timeLeft, setTimeLeft] = useState(60);
      const [wordList, setWordList] = useState([]);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [typedInput, setTypedInput] = useState('');
      const [isError, setIsError] = useState(false);

      const [completedWordsCount, setCompletedWordsCount] = useState(0);
      const [correctKeystrokes, setCorrectKeystrokes] = useState(0);
      const [totalKeystrokes, setTotalKeystrokes] = useState(0);
      const [currentCombo, setCurrentCombo] = useState(0);
      const [maxCombo, setMaxCombo] = useState(0);
      const [highScore, setHighScore] = useState(() => Number(localStorage.getItem('timeattack_high_score') || '0'));

      const inputRef = useRef(null);
      const timerRef = useRef(null);

      const focusInput = () => inputRef.current?.focus();
      const getShuffledWords = () => [...TRAVEL_WORDS].sort(() => Math.random() - 0.5);
      const currentWord = wordList[currentIndex] || TRAVEL_WORDS[0];
      const targetWord = currentWord.word.toLowerCase();

      const startGame = () => {
        const shuffled = getShuffledWords();
        setWordList(shuffled);
        setCurrentIndex(0);
        setTypedInput('');
        setIsError(false);
        setTimeLeft(60);
        setCompletedWordsCount(0);
        setCorrectKeystrokes(0);
        setTotalKeystrokes(0);
        setCurrentCombo(0);
        setMaxCombo(0);
        setGameState('PLAYING');

        setTimeout(() => {
          focusInput();
          soundController.speakEnglish(shuffled[0].word);
        }, 50);
      };

      useEffect(() => {
        if (gameState !== 'PLAYING') return;
        timerRef.current = window.setInterval(() => {
          setTimeLeft(prev => {
            if (prev <= 1) {
              clearInterval(timerRef.current);
              setGameState('FINISHED');
              soundController.playVictory();
              try { confetti({ particleCount: 70, spread: 60 }); } catch(e) {}
              return 0;
            }
            return prev - 1;
          });
        }, 1000);
        return () => { if (timerRef.current) clearInterval(timerRef.current); };
      }, [gameState]);

      useEffect(() => {
        if (completedWordsCount > highScore) {
          setHighScore(completedWordsCount);
          try { localStorage.setItem('timeattack_high_score', String(completedWordsCount)); } catch(e) {}
        }
      }, [completedWordsCount, highScore]);

      const handleInputChange = (e) => {
        if (gameState !== 'PLAYING') return;
        const value = e.target.value.toLowerCase();
        if (value.length > typedInput.length) {
          setTotalKeystrokes(prev => prev + 1);
          const expectedPrefix = targetWord.slice(0, value.length);
          if (value === expectedPrefix) {
            soundController.playKeyClick();
            setIsError(false);
            setTypedInput(value);
            setCorrectKeystrokes(prev => prev + 1);
            setCurrentCombo(prev => {
              const next = prev + 1;
              if (next > maxCombo) setMaxCombo(next);
              return next;
            });
            if (value === targetWord) {
              soundController.playWordSuccess();
              setCompletedWordsCount(prev => prev + 1);
              setTypedInput('');
              if (currentIndex < wordList.length - 1) {
                const nextIdx = currentIndex + 1;
                setCurrentIndex(nextIdx);
                soundController.speakEnglish(wordList[nextIdx].word);
              } else {
                const fresh = getShuffledWords();
                setWordList(fresh);
                setCurrentIndex(0);
                soundController.speakEnglish(fresh[0].word);
              }
            }
          } else {
            soundController.playTypo();
            setIsError(true);
            setCurrentCombo(0);
            setTimeout(() => setIsError(false), 200);
          }
        } else {
          setTypedInput(value);
          setIsError(false);
        }
      };

      const accuracy = totalKeystrokes > 0 ? Math.round((correctKeystrokes / totalKeystrokes) * 100) : 100;
      const elapsedMinutes = (60 - timeLeft) / 60 || 0.05;
      const cpm = Math.round(correctKeystrokes / Math.max(elapsedMinutes, 0.05));

      return (
        <div className="w-full max-w-4xl mx-auto px-4 py-6" onClick={focusInput}>
          <div className="bg-white border border-stone-200/90 rounded-2xl p-4 sm:p-5 shadow-xs mb-6 flex flex-wrap items-center justify-between gap-4">
            <div>
              <span className="text-xs text-stone-500">모드</span>
              <h2 className="text-base font-bold text-stone-900">60초 공항 러시 (타임 어택)</h2>
            </div>
            <div className="flex items-center gap-6">
              <div>
                <span className="text-[10px] text-stone-500 block">남은 시간</span>
                <span className={`text-xl font-black font-mono ${timeLeft <= 10 ? 'text-rose-600' : 'text-stone-900'}`}>{timeLeft}s</span>
              </div>
              <div className="text-right">
                <span className="text-[10px] text-stone-500 block">완료 단어</span>
                <span className="text-xl font-bold font-mono text-amber-600">{completedWordsCount}개</span>
              </div>
              <div className="text-right">
                <span className="text-[10px] text-stone-500 block">최고 기록</span>
                <span className="text-xl font-bold font-mono text-stone-700">{highScore}개</span>
              </div>
            </div>
          </div>

          <div className="relative bg-white border border-stone-200 rounded-3xl p-6 sm:p-10 shadow-sm min-h-[380px] flex flex-col justify-center">
            {gameState === 'IDLE' && (
              <div className="text-center py-6">
                <div className="w-16 h-16 rounded-2xl bg-amber-500/10 text-amber-700 flex items-center justify-center text-3xl mx-auto mb-4">⏱️</div>
                <h3 className="text-2xl font-bold text-stone-900 mb-2">60초 동안 몇 개나 칠 수 있을까요?</h3>
                <p className="text-sm text-stone-600 max-w-md mx-auto mb-6 leading-relaxed">
                  해외여행 필수 쉬운 영어 단어 15개를 1분 동안 최대한 빠르고 정확하게 입력해보세요!
                </p>
                <div className="flex flex-col sm:flex-row items-center justify-center gap-3">
                  <button onClick={startGame} className="w-full sm:w-auto px-6 py-3 text-sm font-semibold text-white bg-amber-600 rounded-xl hover:bg-amber-700 shadow-sm transition-transform active:scale-95 inline-flex items-center justify-center gap-2 cursor-pointer">
                    <IconPlay className="w-4 h-4 fill-white" />
                    <span>60초 타임 어택 시작</span>
                  </button>
                  <button onClick={() => setShowLeaderboard(true)} className="w-full sm:w-auto px-5 py-3 text-sm font-bold text-amber-950 bg-amber-300 hover:bg-amber-400 border border-amber-400 rounded-xl shadow-xs transition-transform active:scale-95 inline-flex items-center justify-center gap-1.5 cursor-pointer">
                    <span>🏆 명예의 전당</span>
                  </button>
                </div>
              </div>
            )}

            {gameState === 'FINISHED' && (
              <div className="text-center py-6 animate-fade-in">
                <IconTrophy className="w-14 h-14 text-amber-500 mx-auto mb-2" />
                <h3 className="text-2xl font-black text-stone-900 mb-1">시간 종료!</h3>
                <p className="text-xs text-stone-500 mb-6">60초 동안 놀라운 여행 타자 실력을 보여주셨어요!</p>

                <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 max-w-xl mx-auto mb-6">
                  <div className="p-3 bg-stone-50 rounded-xl border border-stone-200">
                    <span className="text-xs text-stone-500 block">완료 단어</span>
                    <span className="text-2xl font-black font-mono text-amber-600">{completedWordsCount}개</span>
                  </div>
                  <div className="p-3 bg-stone-50 rounded-xl border border-stone-200">
                    <span className="text-xs text-stone-500 block">타수 (CPM)</span>
                    <span className="text-2xl font-black font-mono text-stone-900">{cpm}</span>
                  </div>
                  <div className="p-3 bg-stone-50 rounded-xl border border-stone-200">
                    <span className="text-xs text-stone-500 block">정확도</span>
                    <span className="text-2xl font-black font-mono text-emerald-700">{accuracy}%</span>
                  </div>
                  <div className="p-3 bg-stone-50 rounded-xl border border-stone-200">
                    <span className="text-xs text-stone-500 block">최대 콤보</span>
                    <span className="text-2xl font-black font-mono text-amber-700">{maxCombo}</span>
                  </div>
                </div>

                <GameResultRecordSection
                  score={`${completedWordsCount}개 단어 (${cpm} CPM)`}
                  onRestartWithoutSaving={startGame}
                />
              </div>
            )}

            {gameState === 'PLAYING' && (
              <div className="text-center">
                <div className="font-mono text-4xl sm:text-6xl font-bold tracking-wider select-none mb-3">
                  {targetWord.split('').map((char, index) => (
                    <span
                      key={index}
                      className={`inline-block transition-colors duration-100 ${
                        index < typedInput.length ? 'text-emerald-600 font-extrabold' : index === typedInput.length ? 'text-stone-900 border-b-4 border-amber-500 animate-pulse' : 'text-stone-300'
                      }`}
                    >
                      {char}
                    </span>
                  ))}
                </div>

                <div className="space-y-1 mb-6">
                  <div className="text-2xl sm:text-3xl font-extrabold text-stone-900">{currentWord.meaning}</div>
                  <div className="text-sm font-medium text-amber-800">{currentWord.pronunciation}</div>
                </div>

                <div className="max-w-md mx-auto">
                  <input
                    ref={inputRef}
                    type="text"
                    value={typedInput}
                    onChange={handleInputChange}
                    autoComplete="off"
                    autoCorrect="off"
                    autoCapitalize="none"
                    spellCheck="false"
                    placeholder="단어를 빠르게 입력하세요..."
                    className={`w-full py-3 px-5 text-center text-lg font-mono font-medium rounded-xl border focus:outline-none focus:ring-2 focus:ring-amber-500 bg-stone-50/50 ${
                      isError ? 'border-rose-400 bg-rose-50/20' : 'border-stone-300'
                    }`}
                  />
                </div>

                <div className="flex items-center justify-center gap-6 mt-6 text-xs text-stone-500 font-mono">
                  <span>연속 콤보: <strong className="text-amber-600">{currentCombo}</strong></span>
                  <span>·</span>
                  <span>현재 타수: <strong className="text-stone-800">{cpm} CPM</strong></span>
                  <span>·</span>
                  <span>정확도: <strong className="text-emerald-700">{accuracy}%</strong></span>
                </div>
              </div>
            )}
          </div>

          <RecordsModal isOpen={showLeaderboard} onClose={() => setShowLeaderboard(false)} />
        </div>
      );
    };

    // ==========================================
    // 11. SKY DROP MODE (스카이 드롭)
    // ==========================================
    const SkyDropMode = () => {
      const [gameState, setGameState] = useState('IDLE');
      const [showLeaderboard, setShowLeaderboard] = useState(false);
      const [fallingWords, setFallingWords] = useState([]);
      const [inputVal, setInputVal] = useState('');
      const [score, setScore] = useState(0);
      const [lives, setLives] = useState(3);
      const [wordsCleared, setWordsCleared] = useState(0);
      const [highScore, setHighScore] = useState(() => Number(localStorage.getItem('skydrop_high_score') || '0'));

      const inputRef = useRef(null);
      const nextSpawnTime = useRef(0);
      const frameRef = useRef(null);

      const focusInput = () => inputRef.current?.focus();

      const startGame = () => {
        setGameState('PLAYING');
        setFallingWords([]);
        setInputVal('');
        setScore(0);
        setLives(3);
        setWordsCleared(0);
        nextSpawnTime.current = Date.now() + 500;
        setTimeout(focusInput, 50);
      };

      const spawnWord = useCallback(() => {
        const randomWord = TRAVEL_WORDS[Math.floor(Math.random() * TRAVEL_WORDS.length)];
        const newWord = {
          id: `${randomWord.id}-${Date.now()}-${Math.random()}`,
          data: randomWord,
          x: 10 + Math.random() * 70,
          y: 0,
          speed: 0.18 + Math.min(wordsCleared * 0.015, 0.35)
        };
        setFallingWords(prev => [...prev, newWord]);
      }, [wordsCleared]);

      useEffect(() => {
        if (gameState !== 'PLAYING') return;
        let lastTick = Date.now();

        const loop = () => {
          const now = Date.now();
          const delta = (now - lastTick) / 16;
          lastTick = now;

          if (now > nextSpawnTime.current && fallingWords.length < 3) {
            spawnWord();
            nextSpawnTime.current = now + Math.max(2200 - wordsCleared * 40, 1400);
          }

          setFallingWords(prev => {
            const nextWords = [];
            let lostLife = false;
            for (const item of prev) {
              const nextY = item.y + item.speed * delta;
              if (nextY >= 82) {
                lostLife = true;
                soundController.playTypo();
              } else {
                nextWords.push({ ...item, y: nextY });
              }
            }
            if (lostLife) {
              setLives(l => {
                const nextL = l - 1;
                if (nextL <= 0) {
                  setGameState('GAMEOVER');
                  soundController.playVictory();
                }
                return nextL;
              });
            }
            return nextWords;
          });

          frameRef.current = requestAnimationFrame(loop);
        };

        frameRef.current = requestAnimationFrame(loop);
        return () => { if (frameRef.current) cancelAnimationFrame(frameRef.current); };
      }, [gameState, fallingWords.length, spawnWord, wordsCleared]);

      useEffect(() => {
        if (score > highScore) {
          setHighScore(score);
          try { localStorage.setItem('skydrop_high_score', String(score)); } catch(e) {}
        }
      }, [score, highScore]);

      const handleInputChange = (e) => {
        const val = e.target.value.toLowerCase().trim();
        setInputVal(val);
        const matched = fallingWords.find(item => item.data.word.toLowerCase() === val);
        if (matched) {
          soundController.playWordSuccess();
          soundController.speakEnglish(matched.data.word);
          setFallingWords(prev => prev.filter(item => item.id !== matched.id));
          setScore(s => s + 100 + Math.round((82 - matched.y) * 2));
          setWordsCleared(w => w + 1);
          setInputVal('');
        }
      };

      return (
        <div className="w-full max-w-4xl mx-auto px-4 py-6" onClick={focusInput}>
          <div className="bg-white border border-stone-200/90 rounded-2xl p-4 sm:p-5 shadow-xs mb-4 flex items-center justify-between">
            <div>
              <span className="text-xs text-stone-500">모드</span>
              <h2 className="text-base font-bold text-stone-900">스카이 드롭 (하늘에서 내리는 여행 단어)</h2>
            </div>
            <div className="flex items-center gap-6">
              <div className="text-right">
                <span className="text-xs text-stone-500 block">점수</span>
                <span className="text-lg font-bold font-mono text-amber-600">{score}</span>
              </div>
              <div className="text-right">
                <span className="text-xs text-stone-500 block">최고 기록</span>
                <span className="text-lg font-bold font-mono text-stone-700">{highScore}</span>
              </div>
              <div className="flex items-center gap-1">
                {[1, 2, 3].map(heartIdx => (
                  <IconHeart key={heartIdx} className={`w-5 h-5 ${heartIdx <= lives ? 'text-rose-500 fill-rose-500' : 'text-stone-300'}`} fill={heartIdx <= lives} />
                ))}
              </div>
            </div>
          </div>

          <div className="relative w-full h-[460px] bg-gradient-to-b from-sky-50 via-sky-100/30 to-amber-50/40 border border-stone-200 rounded-3xl overflow-hidden shadow-inner">
            <div className="absolute top-6 left-12 text-sky-200 text-5xl opacity-40 select-none">☁</div>
            <div className="absolute top-16 right-20 text-sky-200 text-6xl opacity-30 select-none">☁</div>

            {gameState === 'IDLE' && (
              <div className="absolute inset-0 flex flex-col items-center justify-center p-6 text-center bg-white/70 backdrop-blur-2xs z-20">
                <div className="w-16 h-16 rounded-2xl bg-amber-500/10 text-amber-700 flex items-center justify-center text-3xl mb-4">🧳</div>
                <h3 className="text-2xl font-bold text-stone-900 mb-2">스카이 드롭 여행 타자</h3>
                <p className="text-sm text-stone-600 max-w-md mb-6 leading-relaxed">
                  하늘에서 수하물 태그처럼 내려오는 15개의 여행 영단어를 바닥에 닿기 전에 입력하세요!
                </p>
                <div className="flex flex-col sm:flex-row items-center justify-center gap-3">
                  <button onClick={startGame} className="w-full sm:w-auto px-6 py-3 text-sm font-semibold text-white bg-amber-600 rounded-xl hover:bg-amber-700 shadow-sm transition-transform active:scale-95 flex items-center justify-center gap-2 cursor-pointer">
                    <IconPlay className="w-4 h-4 fill-white" />
                    <span>게임 시작하기</span>
                  </button>
                  <button onClick={() => setShowLeaderboard(true)} className="w-full sm:w-auto px-5 py-3 text-sm font-bold text-amber-950 bg-amber-300 hover:bg-amber-400 border border-amber-400 rounded-xl shadow-xs transition-transform active:scale-95 flex items-center justify-center gap-1.5 cursor-pointer">
                    <span>🏆 명예의 전당</span>
                  </button>
                </div>
              </div>
            )}

            {gameState === 'GAMEOVER' && (
              <div className="absolute inset-0 flex flex-col items-center justify-center p-6 text-center bg-white/90 backdrop-blur-xs z-20 overflow-y-auto animate-fade-in">
                <IconTrophy className="w-12 h-12 text-amber-500 mb-1 shrink-0" />
                <h3 className="text-2xl font-black text-stone-900 mb-0.5">여행 완료!</h3>
                <p className="text-xs text-stone-500 mb-2">하늘에서 내려온 단어들을 멋지게 받아쳤어요</p>

                <div className="flex items-center gap-6 my-2 p-3 bg-stone-50 rounded-2xl border border-stone-200 shrink-0">
                  <div>
                    <span className="text-xs text-stone-500 block">최종 점수</span>
                    <span className="text-2xl font-black font-mono text-amber-600">{score}점</span>
                  </div>
                  <div className="border-l border-stone-200 pl-6">
                    <span className="text-xs text-stone-500 block">정복한 단어</span>
                    <span className="text-2xl font-black font-mono text-stone-900">{wordsCleared}개</span>
                  </div>
                </div>

                <GameResultRecordSection
                  score={`${score}점 (${wordsCleared}개 클리어)`}
                  onRestartWithoutSaving={startGame}
                />
              </div>
            )}

            {fallingWords.map(item => (
              <div
                key={item.id}
                style={{ left: `${item.x}%`, top: `${item.y}%`, transform: 'translateX(-50%)' }}
                className="absolute transition-transform flex flex-col items-center select-none"
              >
                <div className="bg-white/95 border-2 border-amber-600/60 rounded-2xl p-2.5 px-4 shadow-md backdrop-blur-xs flex flex-col items-center min-w-[130px]">
                  <div className="flex items-center gap-1.5">
                    <span className="text-xs">🏷️</span>
                    <span className="font-mono text-lg font-black text-stone-900 tracking-wide uppercase">{item.data.word}</span>
                  </div>
                  <div className="text-xs font-bold text-amber-800 mt-0.5">{item.data.meaning}</div>
                  <div className="text-[10px] text-stone-400">{item.data.pronunciation}</div>
                </div>
                <div className="w-0.5 h-3 bg-amber-400/50 -order-1" />
              </div>
            ))}

            <div className="absolute bottom-0 left-0 right-0 h-16 bg-stone-800 border-t-4 border-amber-500 flex items-center justify-between px-6 text-stone-400 text-xs font-mono">
              <div className="flex items-center gap-2">
                <span className="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse" />
                <span className="text-stone-200 font-semibold tracking-wider">AIRPORT LUGGAGE BELT</span>
              </div>
              <div className="text-stone-400 hidden sm:inline">단어가 컨베이어 벨트에 닿기 전에 입력하세요!</div>
            </div>
          </div>

          <div className="mt-4 max-w-md mx-auto">
            <input
              ref={inputRef}
              type="text"
              value={inputVal}
              onChange={handleInputChange}
              disabled={gameState !== 'PLAYING'}
              placeholder={gameState === 'PLAYING' ? "내려오는 단어를 입력하고 자동 매치..." : "게임을 시작하면 활성화됩니다"}
              className="w-full py-3 px-5 text-center text-lg font-mono font-medium rounded-xl border border-stone-300 focus:outline-none focus:ring-2 focus:ring-amber-500 bg-white shadow-xs disabled:bg-stone-100 disabled:text-stone-400"
            />
          </div>

          <RecordsModal isOpen={showLeaderboard} onClose={() => setShowLeaderboard(false)} />
        </div>
      );
    };

    // ==========================================
    // 12. WORD LIST MODE (단어 사전 & 발음)
    // ==========================================
    const WordListMode = ({ onStartJourney }) => {
      const [selectedCategory, setSelectedCategory] = useState('전체');
      const [searchQuery, setSearchQuery] = useState('');
      const [practiceStates, setPracticeStates] = useState({});
      const [successStates, setSuccessStates] = useState({});

      const categories = ['전체', '공항/입국', '교통/이동', '숙소/휴식', '식당/카페', '쇼핑/계산', '안전/편의'];

      const filteredWords = TRAVEL_WORDS.filter(item => {
        const matchCategory = selectedCategory === '전체' || item.category === selectedCategory;
        const matchQuery =
          item.word.toLowerCase().includes(searchQuery.toLowerCase()) ||
          item.meaning.includes(searchQuery) ||
          item.pronunciation.includes(searchQuery);
        return matchCategory && matchQuery;
      });

      const handlePracticeChange = (id, target, val) => {
        const input = val.toLowerCase();
        setPracticeStates(prev => ({ ...prev, [id]: input }));
        if (input === target.toLowerCase()) {
          soundController.playWordSuccess();
          setSuccessStates(prev => ({ ...prev, [id]: true }));
          setTimeout(() => {
            setSuccessStates(prev => ({ ...prev, [id]: false }));
            setPracticeStates(prev => ({ ...prev, [id]: '' }));
          }, 1200);
        } else {
          soundController.playKeyClick();
        }
      };

      return (
        <div className="w-full max-w-5xl mx-auto px-4 py-6">
          <div className="relative overflow-hidden bg-gradient-to-r from-amber-900 to-stone-900 text-white rounded-3xl p-6 sm:p-8 mb-6 shadow-md">
            <div className="relative z-10 max-w-2xl">
              <span className="text-amber-300 text-xs font-semibold tracking-wider uppercase block mb-1">TRAVEL VOCABULARY GUIDE</span>
              <h2 className="text-2xl sm:text-3xl font-extrabold tracking-tight mb-2">해외여행 필수 쉬운 영어 단어 15선</h2>
              <p className="text-stone-300 text-xs sm:text-sm leading-relaxed mb-4">
                출입국 심사부터 호텔 체크인, 식당 주문, 길 찾기까지! 각 단어의 정확한 한글 뜻과 원어민 발음, 실전 여행 예문을 익혀보세요.
              </p>
              <button
                onClick={onStartJourney}
                className="px-5 py-2.5 text-xs font-semibold bg-amber-500 text-stone-950 rounded-xl hover:bg-amber-400 transition-colors inline-flex items-center gap-1.5 shadow-sm"
              >
                <span>15단어 완주 타자 게임 시작</span>
                <IconArrowRight className="w-3.5 h-3.5" />
              </button>
            </div>
            <div className="absolute -right-10 -bottom-10 text-white/5 text-[180px] font-black select-none pointer-events-none">✈</div>
          </div>

          <div className="flex flex-col sm:flex-row items-center justify-between gap-4 mb-6">
            <div className="flex items-center gap-1 p-1 bg-stone-100 rounded-xl overflow-x-auto max-w-full">
              {categories.map(cat => (
                <button
                  key={cat}
                  onClick={() => setSelectedCategory(cat)}
                  className={`px-3 py-1.5 text-xs font-medium rounded-lg transition-colors whitespace-nowrap shrink-0 ${
                    selectedCategory === cat ? 'bg-white text-stone-900 shadow-xs font-semibold' : 'text-stone-600 hover:text-stone-900'
                  }`}
                >
                  {cat}
                </button>
              ))}
            </div>
            <div className="relative w-full sm:w-64">
              <IconSearch className="w-4 h-4 text-stone-400 absolute left-3 top-1/2 -translate-y-1/2" />
              <input
                type="text"
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                placeholder="단어 또는 뜻 검색..."
                className="w-full pl-9 pr-3 py-1.5 text-xs rounded-xl border border-stone-200 bg-white focus:outline-none focus:ring-2 focus:ring-amber-500"
              />
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            {filteredWords.map(item => {
              const isSuccess = successStates[item.id];
              const practiceVal = practiceStates[item.id] || '';
              return (
                <div
                  key={item.id}
                  className={`bg-white border rounded-2xl p-5 shadow-xs transition-all hover:shadow-md flex flex-col justify-between ${
                    isSuccess ? 'border-emerald-500 bg-emerald-50/20 ring-2 ring-emerald-500/20' : 'border-stone-200'
                  }`}
                >
                  <div>
                    <div className="flex items-center justify-between text-xs text-stone-400 mb-2">
                      <span className="font-mono font-medium">#{item.id} · {item.category}</span>
                      <button
                        onClick={() => soundController.speakEnglish(item.word)}
                        className="p-1.5 rounded-lg bg-stone-100 hover:bg-stone-200 text-stone-700 transition-colors"
                        title="단어 발음 듣기"
                      >
                        <IconVolume2 className="w-3.5 h-3.5 text-amber-600" />
                      </button>
                    </div>

                    <div className="mb-3">
                      <div className="text-2xl font-bold font-mono text-stone-900 tracking-wide uppercase">{item.word}</div>
                      <div className="text-base font-extrabold text-amber-900 mt-0.5">{item.meaning}</div>
                      <div className="text-xs text-stone-500 mt-0.5">{item.pronunciation}</div>
                    </div>

                    <div className="p-2.5 bg-stone-50 rounded-xl text-xs text-stone-600 mb-3 leading-relaxed">
                      <span className="font-semibold text-stone-800">💡 여행 팁: </span>{item.tip}
                    </div>

                    <div className="border-t border-stone-100 pt-2.5 text-xs space-y-1">
                      <div className="flex items-center justify-between text-stone-800 font-medium">
                        <span className="italic">"{item.exampleSentence}"</span>
                        <button onClick={() => soundController.speakEnglish(item.exampleSentence)} className="p-1 text-stone-400 hover:text-amber-600">
                          <IconVolume2 className="w-3 h-3" />
                        </button>
                      </div>
                      <div className="text-stone-500">"{item.exampleTranslation}"</div>
                    </div>
                  </div>

                  <div className="mt-4 pt-3 border-t border-stone-100">
                    <div className="relative">
                      <input
                        type="text"
                        value={practiceVal}
                        onChange={(e) => handlePracticeChange(item.id, item.word, e.target.value)}
                        placeholder={`타이핑 연습: ${item.word}`}
                        className={`w-full py-1.5 px-3 text-xs font-mono rounded-lg border focus:outline-none transition-colors ${
                          isSuccess ? 'border-emerald-500 bg-emerald-50 text-emerald-800' : 'border-stone-200 bg-stone-50/50 focus:border-amber-500'
                        }`}
                      />
                      {isSuccess && (
                        <span className="absolute right-2.5 top-1/2 -translate-y-1/2 text-emerald-600 flex items-center gap-1 text-[11px] font-bold">
                          <IconCheck className="w-3 h-3" /> 완성!
                        </span>
                      )}
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    };

    // ==========================================
    // 13. TOP HEADER COMPONENT
    // ==========================================
    const Header = ({ currentTab, onSelectTab, soundEnabled, onToggleSound, bgmEnabled, onToggleBgm, onOpenRecords }) => (
      <header className="flex items-center justify-between gap-4 sm:gap-8 px-4 sm:px-6 py-4 border-b border-stone-200 bg-white/95 backdrop-blur-sm sticky top-0 z-30">
        <div onClick={() => onSelectTab('promotion')} className="flex items-center gap-2.5 cursor-pointer whitespace-nowrap shrink-0 group">
          <div className="w-9 h-9 rounded-xl bg-amber-500/10 text-amber-700 flex items-center justify-center transition-transform group-hover:scale-105">
            <IconPlane className="w-5 h-5 text-amber-600 rotate-[-20deg]" />
          </div>
          <span className="text-lg font-bold tracking-tight text-stone-900 whitespace-nowrap">여행 영어 타자</span>
        </div>

        <nav className="flex items-center gap-1 sm:gap-1.5 p-1 bg-stone-100/90 rounded-xl overflow-x-auto">
          {[
            { id: 'promotion', label: '단계별 승급' },
            { id: 'journey', label: '15단어 완주' },
            { id: 'timeattack', label: '60초 러시' },
            { id: 'skydrop', label: '스카이 드롭' },
            { id: 'vocab', label: '단어 사전 & 발음' }
          ].map(tab => (
            <button
              key={tab.id}
              onClick={() => onSelectTab(tab.id)}
              className={`px-3 sm:px-3.5 py-1.5 text-xs sm:text-sm font-semibold rounded-lg transition-all whitespace-nowrap shrink-0 ${
                currentTab === tab.id ? 'bg-white text-stone-900 shadow-sm' : 'text-stone-600 hover:text-stone-900'
              }`}
            >
              {tab.label}
            </button>
          ))}
        </nav>

        <div className="flex items-center gap-2 sm:gap-3 shrink-0">
          <button
            onClick={onOpenRecords}
            title="명예의 전당 (저장된 기록 보기)"
            className="px-3 py-2 text-xs font-semibold rounded-lg border border-amber-300 bg-amber-50 hover:bg-amber-100/80 text-amber-900 transition-all flex items-center gap-1.5 cursor-pointer"
          >
            <IconTrophy className="w-3.5 h-3.5 text-amber-600" />
            <span className="hidden sm:inline">명예의 전당</span>
          </button>

          {/* Public MP3 BGM Toggle Button */}
          <button
            onClick={onToggleBgm}
            title={bgmEnabled ? '배경음악 끄기' : '배경음악 켜기 (public/bgm.mp3)'}
            className={`px-3 py-2 text-xs font-medium rounded-lg border transition-all flex items-center gap-1.5 cursor-pointer ${
              bgmEnabled ? 'border-amber-400 bg-amber-100 text-amber-900 shadow-xs' : 'border-stone-200 bg-stone-100 text-stone-400 hover:bg-stone-200'
            }`}
          >
            <IconMusic className="w-3.5 h-3.5" />
            <span className="hidden md:inline">{bgmEnabled ? 'BGM 켬' : 'BGM 끔'}</span>
          </button>

          <button
            onClick={onToggleSound}
            title={soundEnabled ? '효과음 끄기' : '효과음 켜기'}
            className={`px-3.5 py-2 text-xs font-medium rounded-lg border transition-all flex items-center gap-2 whitespace-nowrap shrink-0 ${
              soundEnabled ? 'border-stone-300 bg-white text-stone-800 hover:bg-stone-50' : 'border-stone-200 bg-stone-100 text-stone-400 hover:bg-stone-200'
            }`}
          >
            {soundEnabled ? (
              <>
                <IconVolume2 className="w-4 h-4 text-emerald-600" />
                <span className="hidden md:inline">소리 켬</span>
              </>
            ) : (
              <>
                <IconVolumeX className="w-4 h-4 text-stone-400" />
                <span className="hidden md:inline">음소거</span>
              </>
            )}
          </button>
        </div>
      </header>
    );

    // ==========================================
    // 14. MAIN ROOT APPLICATION
    // ==========================================
    function App() {
      const [currentTab, setCurrentTab] = useState('promotion');
      const [soundEnabled, setSoundEnabled] = useState(true);
      const [bgmEnabled, setBgmEnabled] = useState(false);
      const [showRecordsModal, setShowRecordsModal] = useState(false);

      const toggleSound = () => {
        const next = !soundEnabled;
        setSoundEnabled(next);
        soundController.enabled = next;
        if (next) soundController.playKeyClick();
      };

      const toggleBgm = () => {
        const next = bgmController.toggle();
        setBgmEnabled(next);
      };

      return (
        <div className="min-h-screen flex flex-col bg-[#F9F8F6] text-stone-900 font-sans selection:bg-amber-200">
          <Header
            currentTab={currentTab}
            onSelectTab={setCurrentTab}
            soundEnabled={soundEnabled}
            onToggleSound={toggleSound}
            bgmEnabled={bgmEnabled}
            onToggleBgm={toggleBgm}
            onOpenRecords={() => setShowRecordsModal(true)}
          />

          {/* Hero Welcome Strip */}
          <div className="w-full bg-gradient-to-b from-white to-[#F9F8F6] border-b border-stone-200/60 py-6 px-4">
            <div className="max-w-5xl mx-auto flex flex-col md:flex-row items-center justify-between gap-6">
              <div className="space-y-1.5 text-center md:text-left">
                <div className="flex items-center justify-center md:justify-start gap-2 text-xs font-semibold text-amber-700">
                  <IconCompass className="w-4 h-4 text-amber-600" />
                  <span>AIRLINE TIER PROMOTION CHALLENGE</span>
                </div>
                <h1 className="text-2xl sm:text-3xl font-extrabold tracking-tight text-stone-900 text-balance">
                  해외여행 영어 타자 단계별 승급전
                </h1>
                <p className="text-xs sm:text-sm text-stone-600 max-w-2xl leading-relaxed">
                  이코노미부터 VIP 마스터까지! 단어를 입력하고 아래 <strong className="text-amber-800">한글 뜻과 원어민 발음</strong>을 익히며 클래스를 한 단계씩 승급해보세요.
                </p>
              </div>

              <div className="flex items-center gap-4 text-xs text-stone-600 bg-white/80 border border-stone-200/80 rounded-2xl p-3 px-4 shadow-2xs shrink-0">
                <div className="text-center">
                  <span className="text-[10px] text-stone-400 block font-semibold">승급 단계</span>
                  <strong className="text-stone-900 font-mono text-sm">5 TIERS</strong>
                </div>
                <span className="text-stone-300">|</span>
                <div className="text-center">
                  <span className="text-[10px] text-stone-400 block font-semibold">단어 + 한글 뜻</span>
                  <strong className="text-emerald-700 font-mono text-sm">15 WORDS</strong>
                </div>
                <span className="text-stone-300">|</span>
                <div className="text-center">
                  <span className="text-[10px] text-stone-400 block font-semibold">최고 등급</span>
                  <strong className="text-amber-700 font-mono text-sm">VIP MASTER</strong>
                </div>
              </div>
            </div>
          </div>

          {/* Main Views */}
          <main className="flex-1">
            {currentTab === 'promotion' && (
              <TierPromotionMode onOpenVocab={() => setCurrentTab('vocab')} />
            )}
            {currentTab === 'journey' && (
              <JourneyMode onOpenVocab={() => setCurrentTab('vocab')} />
            )}
            {currentTab === 'timeattack' && (
              <TimeAttackMode />
            )}
            {currentTab === 'skydrop' && (
              <SkyDropMode />
            )}
            {currentTab === 'vocab' && (
              <WordListMode onStartJourney={() => setCurrentTab('promotion')} />
            )}
          </main>

          {/* Footer */}
          <footer className="border-t border-stone-200/80 bg-white mt-12 py-6 px-6 text-center text-xs text-stone-500">
            <div className="max-w-5xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
              <div className="flex items-center gap-2">
                <IconPlane className="w-4 h-4 text-amber-600 rotate-[-20deg]" />
                <span className="font-semibold text-stone-800">여행 영어 타자 (Travel English Typing)</span>
                <span>·</span>
                <span>단계별 승급전 (이코노미 ➔ 비즈니스 ➔ 퍼스트 ➔ VIP 마스터)</span>
              </div>
              <div className="text-stone-400 text-[11px]">
                Passport · Ticket · Hotel · Airport · Luggage · Subway · Taxi · Menu · Water · Coffee · Bill · Receipt · Restroom · Help · Station
              </div>
            </div>
          </footer>

          <RecordsModal isOpen={showRecordsModal} onClose={() => setShowRecordsModal(false)} />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
